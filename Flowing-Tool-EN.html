<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>简易流水单 · 辩论记录工具</title>
<style>
:root{--bg:#0d0d0d;--card:#141414;--border:#222;--input-bg:#1a1a1a;--gold:#ffc000;--text:#eee;--gray:#999;--dark-gray:#555;--blue:#4fa8ee;--green:#6ecd71;--red:#ee5555;--radius:8px;--radius-sm:6px}
body.light{--bg:#f5f5f5;--card:#fff;--border:#e0e0e0;--input-bg:#f0f0f0;--gold:#4f6bed;--text:#222;--gray:#666;--dark-gray:#999;--blue:#4f6bed;--green:#4caf50;--red:#e53935}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Microsoft YaHei','PingFang SC',sans-serif;height:100vh;display:flex;flex-direction:column}
header{background:var(--card);padding:14px 24px 14px 80px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:relative}
header h1{font-size:30px;color:var(--gold);position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}
.home-btn{position:absolute;left:20px}
header .step-label{font-size:12px;color:var(--gray)}
main{flex:1;overflow-y:auto;padding:20px;max-width:920px;margin:0 auto;width:100%}

/* Step bar */
.step-bar{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 0 20px;flex-wrap:wrap;font-size:13px}
.step-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0}
.step-bar .dot.done{background:var(--green)}
.step-bar .dot.current{background:var(--gold)}
.step-bar .sep{color:var(--dark-gray);font-size:11px;flex-shrink:0}
.step-bar .label{color:var(--gray);font-size:12px}
.step-bar .label.current{color:var(--gold);font-weight:bold}
.step-bar .label.done{color:var(--green)}

/* Round name centered */
.round-name-center{text-align:center;font-size:18px;color:var(--gold);font-weight:bold;margin-bottom:20px}

/* Start page */
.start-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:24px}
.start-wrap .logo{font-size:36px;margin-bottom:8px}
.start-wrap h2{color:var(--gold);font-size:22px}
.start-wrap .desc{color:var(--gray);font-size:14px;line-height:1.7;max-width:420px}
.start-wrap .desc li{list-style:none;margin:4px 0}
.start-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}

/* Buttons - match workbench */
.btn{background:var(--card);color:var(--gray);border:1px solid var(--border);padding:10px 20px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);color:var(--on-accent);border:none;font-weight:bold}
.btn.gold:hover{opacity:.85}
body.light .btn.gold{color:var(--on-accent)}
.btn-sm{background:var(--card);border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-family:inherit}
.btn-sm:hover{border-color:var(--gold);color:var(--gold)}
.btn-sm.danger{color:var(--red);border-color:transparent}
.btn-sm.danger:hover{border-color:var(--red)}
.btn-sm.gold{border-color:var(--gold);color:var(--gold)}
.btn-sm.gold:hover{background:var(--gold);color:var(--on-accent)}
body.light .btn-sm.gold:hover{color:var(--on-accent)}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{color:var(--gold);font-size:15px;margin:0 0 8px 0;border-bottom:1px solid var(--border);padding-bottom:6px}
.card h4{font-size:13px;color:var(--gray);margin:8px 0 4px}

/* Form rows */
.row-inp{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.row-inp label{color:var(--gray);font-size:12px;width:96px;min-width:96px;padding-top:9px;flex-shrink:0}
.row-inp input,.row-inp textarea,.row-inp select{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
.row-inp textarea{min-height:72px;resize:vertical;width:100%;word-wrap:break-word;white-space:pre-wrap}
.row-inp input:focus,.row-inp textarea:focus,.row-inp select:focus{border-color:var(--gold)}

/* +1 btn */
.plus-one-row{display:flex;gap:10px;align-items:flex-start;margin:8px 0}
.plus-one-row .plus-label{color:var(--gray);font-size:12px;width:96px;min-width:96px;padding-top:9px;flex-shrink:0}
.plus-one-row .ta-wrap{flex:1}
.plus-one-row .ta-wrap textarea{width:100%;min-height:72px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none;resize:vertical;word-wrap:break-word;white-space:pre-wrap}
.plus-one-row .ta-wrap textarea:focus{border-color:var(--gold)}
.plus-one-row .plus-col{display:flex;flex-direction:column;justify-content:flex-end;flex-shrink:0;padding-bottom:2px}

select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:var(--radius-sm);font-size:13px;font-family:inherit;outline:none}
select:focus{border-color:var(--gold)}

/* Round config */
.round-config{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:10px 14px;background:var(--input-bg);border-radius:var(--radius-sm);font-size:13px}
.round-config select{min-width:90px}
.round-config .config-text{color:var(--text);font-size:14px;white-space:nowrap}

/* VS divider */
.vs-divider{text-align:center;padding:8px 0;color:var(--gold);font-weight:bold;font-size:15px}

/* Side divider */
.side-divider{border:none;border-top:2px dashed var(--border);margin:16px 0}

/* Footer bar */
#footer-bar{padding:12px 80px 12px 80px;border-top:1px solid var(--border);flex-shrink:0;display:flex;justify-content:center;background:var(--card);align-items:center;position:relative;gap:8px;flex-wrap:wrap;min-height:48px}
#footer-bar .spacer{flex:1}
#footer-bar .home-btn-left{position:absolute;left:20px;top:50%;transform:translateY(-50%)}
#footer-bar .start-btn-left{position:absolute;left:20px;top:50%;transform:translateY(-50%)}

/* Summary */
.summary-box textarea{min-height:160px;font-size:14px;line-height:1.7;width:100%;word-wrap:break-word;white-space:pre-wrap}
.export-group{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:16px}
.export-group h3{color:var(--gold);font-size:14px;margin-bottom:10px}
.export-group .note{color:var(--gray);font-size:12px;margin-bottom:10px}

/* Theme toggle */
#theme-toggle{background:transparent;border:1px solid var(--border);color:var(--gray);padding:10px 14px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
#theme-toggle:hover{border-color:var(--gold);color:var(--gold)}

/* Utility */
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mb-8{margin-bottom:8px}
.hidden{display:none !important}
.text-sm{font-size:12px}.text-gray{color:var(--gray)}
@media(max-width:600px){
  header{padding:10px 14px;flex-wrap:wrap;gap:6px}.home-btn{position:static;margin-right:auto}header h1{font-size:14px;position:static;transform:none;margin:4px 0;width:100%;text-align:center;order:5}header span{margin-left:auto}
  header .btn-sm{position:static;font-size:11px;padding:6px 8px}
  #theme-toggle{font-size:11px;padding:6px 8px}
  main{padding:12px}
  .card{padding:14px}
  .step-bar .label{font-size:10px}
  .round-config{font-size:12px}
  .row-inp{flex-direction:column;gap:4px}.row-inp label{padding-top:0}
  .plus-one-row{flex-direction:column;gap:4px}.plus-one-row .plus-label{padding-top:0}
  #footer-bar{padding:10px 8px;gap:6px}
  #footer-bar .start-btn-left{position:static;transform:none;font-size:12px;padding:6px 10px}
  #footer-bar .btn{padding:8px 12px;font-size:13px}
  #footer-bar .btn-sm{padding:8px 10px;font-size:12px}
}


/* R5: navigation styling resides in existing native CSS, without new style/JS loop. */
header[data-dc-nav]{
 --dc-nav-line:var(--border,var(--line,#d8dee9));
 --dc-nav-bg:var(--card,var(--bg,#fff));--dc-nav-accent:var(--gold,var(--accent,#4f6bed));
 display:grid;grid-template-columns:minmax(55px,1fr) minmax(0,2fr) minmax(55px,1fr);
 align-items:center;gap:8px;min-height:56px;height:auto;
 padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
}
header[data-dc-nav]>[data-dc-back]{grid-column:1;grid-row:1;justify-self:start;position:static;left:auto;top:auto;transform:none}
header[data-dc-nav]>[data-dc-title]{grid-column:2;grid-row:1;justify-self:center;position:static;inset:auto;transform:none;
 text-align:center;margin:0;min-width:0;max-width:100%;overflow-wrap:anywhere;font-size:clamp(17px,2vw,26px);line-height:1.25}
header[data-dc-nav]>[data-dc-actions]{grid-column:3;grid-row:1;justify-self:end;display:flex;align-items:center;
 justify-content:flex-end;flex-wrap:wrap;gap:6px;margin-left:0}
header[data-dc-nav] [data-dc-back]{min-width:46px;min-height:40px;border:1px solid var(--dc-nav-line);
 background:var(--dc-nav-bg);color:inherit;border-radius:12px;padding:8px 12px;line-height:1.2;
 font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
header[data-dc-nav] button:focus-visible{outline:2px solid var(--dc-nav-accent);outline-offset:2px}
header[data-dc-nav] [data-dc-back]:hover{border-color:var(--dc-nav-accent);box-shadow:0 2px 12px var(--glow,transparent)}
@media(max-width:690px){
 header[data-dc-nav]{grid-template-columns:auto minmax(0,1fr) auto;gap:6px;padding:7px max(9px,env(safe-area-inset-right,0px)) 7px max(9px,env(safe-area-inset-left,0px))}
 header[data-dc-nav]>[data-dc-title]{font-size:clamp(14px,3.5vw,20px)}
 header[data-dc-nav]>[data-dc-actions]{gap:4px}
 header[data-dc-nav]>[data-dc-actions] button{min-height:36px;padding-inline:8px}
 header[data-dc-nav] [data-dc-back]{padding-inline:9px}
}
@media(max-width:430px){
 header[data-dc-nav]:not([data-dc-nav="board"])>[data-dc-title]{grid-column:1/-1;grid-row:2}
 header[data-dc-nav]:not([data-dc-nav="board"])>[data-dc-actions]{grid-column:3;grid-row:1}
}
header[data-dc-nav="board"]{grid-template-columns:auto minmax(100px,1fr) minmax(170px,1.2fr) auto;gap:8px}
header[data-dc-nav="board"]>[data-dc-title]{grid-column:2}
header[data-dc-nav="board"]>.hd-center{grid-column:3;grid-row:1;min-width:0;position:static;transform:none}
header[data-dc-nav="board"]>.hd-right{grid-column:4;grid-row:1}
@media(max-width:1050px){
 header[data-dc-nav="board"]{grid-template-columns:auto minmax(0,1fr) auto}
 header[data-dc-nav="board"]>[data-dc-title]{grid-column:2}
 header[data-dc-nav="board"]>.hd-center{grid-column:1/-1;grid-row:2;justify-self:stretch}
 header[data-dc-nav="board"]>.hd-right{grid-column:3}
}
@media(max-width:600px){
 header[data-dc-nav="board"]{grid-template-columns:auto minmax(0,1fr) auto;row-gap:4px}
 header[data-dc-nav="board"]>[data-dc-title]{grid-column:1/-1;grid-row:2;white-space:normal;justify-self:center}
 header[data-dc-nav="board"]>.hd-center{grid-column:1/-1;grid-row:3;justify-self:stretch}
 header[data-dc-nav="board"]>.hd-right{grid-column:3;grid-row:1}
}
header[data-dc-nav="tendency"]{grid-template-columns:auto minmax(0,1fr) auto auto}
header[data-dc-nav="tendency"]>[data-dc-title]{grid-column:2}
header[data-dc-nav="tendency"]>.spacer{display:none}
header[data-dc-nav="tendency"]>#lang-btn{grid-column:3}
header[data-dc-nav="tendency"]>#hdr-theme{grid-column:4}
header .bar[data-dc-nav="glossary"]{display:flex;flex-wrap:wrap;align-items:center;gap:8px;
 min-height:58px;padding-inline:max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-right,0px))}
header .bar[data-dc-nav="glossary"]>[data-dc-back]{min-height:40px;border-radius:12px;padding:8px 11px}
header .bar[data-dc-nav="glossary"]>[data-dc-title]{flex:1;text-align:center;min-width:100px;position:static;transform:none}
header .bar[data-dc-nav="glossary"]>#search{min-width:100px;max-width:210px;flex:1}

invalid inputs, alter report content, commit a project, or inspect prompts.

factory for Atlas/Startrack offline reports. PreparedFile: {blob,name,mime,kind,
owner,lang,nativeLocation:{directory,folder},profile:'ordinary'|'timer'}.

cancelled, share-not-completed, unsupported, failed. A resolved Promise or an
anchor.click does not establish that the destination file was saved.
WEB: iOS HTTPS uses navigator.share({files:[File]}) ONLY, never title/text;
JSON/MD may use text/plain MIME without changing extension. Android Web JSON/MD
share uses byte-identical .json.txt/.md.txt and text/plain regardless of
canShare(original); original extension is retained for downloads. Unsupported
Web Share falls back to a *user-selected* download, not a silent retry. Explicit
cancellation/failure NEVER auto-downloads. Asynchronously prepared exports wait
for a NEW user click before Web Share; no await before navigator.share.
NATIVE: Use existing Capacitor Filesystem -> URI -> Share or test-only LocalSave
(SAF). Write raw Blob bytes in <=256 KiB slices, Base64 encode each slice, await
writeFile then serial appendFile without encoding. Verify raw byte count/stat;
Timer uses partial -> stat -> rename -> URI while ordinary files use the prior
direct target. Preserve original per-module DOCUMENTS/CACHE folder. Do not
decode entire Blob as text, build whole-file Base64, or share partial files.

as JSON (remove only one leading BOM); original module parser/validator commits
or rejects. Genuine Markdown reports (especially Judge) have independent
report import paths; no code-fence extraction or LLM JSON repair.
FILE MATRIX: JSON/MD/TXT/HTML/CSV/SVG keep actual bytes/MIME; XLSX, JPG,
PNG/audio/other binary MUST keep real bytes and extensions, never TXT aliases.

  async function writeNativeBlob(file,session){
    const C=host.Capacitor,FS=C?.Plugins?.Filesystem;
    if(!FS||typeof FS.writeFile!=='function'||typeof FS.appendFile!=='function'||
       typeof FS.stat!=='function'||typeof FS.getUri!=='function')
      throw Error('Native Filesystem byte operations unavailable');
    const loc=file.nativeLocation;
    if(!loc||!['DOCUMENTS','CACHE'].includes(String(loc.directory))||
       !loc.folder||!/^[-\w/]+$/.test(loc.folder))
      throw Error('Missing audited nativeLocation');
    const dir=loc.directory,final=loc.folder.replace(/\/+$/,'')+'/'+file.name;
    const key=dir+':'+final;
    const occupant=held.get(key);
    if(occupant&&occupant!==session)throw Error('This file is being delivered by another session');
    held.set(key,session);
    session.pathKey=key;
    if(session.artifact)return session.artifact;
    const timer=file.profile==='timer',tmp=timer?final+'.partial-'+(++sequence).toString(36):final;
    let written=0;
    try{
      if(timer&&typeof FS.rename!=='function')throw Error('Timer rename unavailable');
      if(file.blob.size===0){
        await FS.writeFile({path:tmp,data:'',directory:dir,recursive:true});
      }else{
        for(let off=0;off<file.blob.size;off+=BUCKET){
          const buf=new Uint8Array(await file.blob.slice(off,Math.min(file.blob.size,off+BUCKET)).arrayBuffer());
          const data=encode64(buf);
          if(off===0)await FS.writeFile({path:tmp,data,directory:dir,recursive:true});
          else await FS.appendFile({path:tmp,data,directory:dir});
          written+=buf.byteLength;
        }
      }
      if(written!==file.blob.size)throw Error('Native chunk size mismatch');
      const stat=await FS.stat({path:tmp,directory:dir});
      if(Number(stat?.size)!==file.blob.size)throw Error('Native stored bytes mismatch');
      if(timer)await FS.rename({from:tmp,to:final,directory:dir,toDirectory:dir});
      const uri=(await FS.getUri({path:final,directory:dir}))?.uri;
      if(!uri)throw Error('Native file URI missing');
      session.artifact={uri,bytes:written,path:final,directory:dir};
      return session.artifact;
    }catch(e){
      if(timer)try{await FS.deleteFile({path:tmp,directory:dir});}catch(_){}
      throw e;
    }
  }
  async function deliver(input,intent='download',options={}){
    let file;
    try{file=prepare(input);}catch(e){return {status:'failed',method:'prepare',message:String(e.message||e),bytes:0};}
    if(!allowed.has(intent))return receipt(file,'unsupported','unknown-intent');
    const cap=capability(file);
    if(!cap.native){
      if(intent==='download')return webDownload(file);
      if(intent==='share')return webShare(file,cap);
      return receipt(file,'unsupported','web-save-location');
    }
    if(intent==='download')return receipt(file,'unsupported','native-download');
    if(intent==='share'&&!cap.share||intent==='save-local'&&!cap.local)
      return receipt(file,'unsupported','native-plugin');
    const session=options.session||{pathKey:null,artifact:null};
    const own=!options.session;
    try{
      const artifact=await writeNativeBlob(file,session);
      if(intent==='share'){
        try{
          await host.Capacitor.Plugins.Share.share({files:[artifact.uri]});
          return receipt(file,'share-returned','native-share',
            {nativeFileWritten:true,nativeUri:artifact.uri});
        }catch(e){return receipt(file,e?.name==='AbortError'?'share-not-completed':'failed','native-share',
          {nativeFileWritten:true,nativeUri:artifact.uri,errorName:e?.name,message:String(e?.message||e)});}
      }
      try{
        const data=await host.Capacitor.Plugins.LocalSave.saveDocument({
          sourceUri:artifact.uri,name:file.name,mimeType:file.mime});
        if(data?.canceled||data?.cancelled)return receipt(file,'cancelled','native-local-save',
          {nativeFileWritten:true,nativeUri:artifact.uri});
        if(data?.saved&&Number(data.bytes)===file.blob.size)
          return receipt(file,'saved','native-local-save',{nativeFileWritten:true,nativeUri:artifact.uri});
        throw Error('Local save did not confirm byte-complete closed stream');
      }catch(e){return receipt(file,e?.name==='AbortError'?'cancelled':'failed','native-local-save',
        {nativeFileWritten:true,nativeUri:artifact.uri,errorName:e?.name,message:String(e?.message||e)});}
    }catch(e){return receipt(file,'failed','native-write',{errorName:e?.name,message:String(e?.message||e)});}
    finally{if(own&&session.pathKey)held.delete(session.pathKey);}
  }
  function present(input,options={}){
    let file;
    try{file=prepare(input);}catch(e){return Promise.resolve({status:'failed',method:'prepare',message:String(e.message||e)});}
    const cap=capability(file);
    if(!cap.mobile&&!cap.native)return deliver(file,'download');
    const doc=host.document;
    if(!doc||!doc.body)return deliver(file,cap.native?'share':'download');
    return new Promise(resolve=>{
      const session={pathKey:null,artifact:null};
      const layer=doc.createElement('div');
      layer.style.cssText='position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px';
      const box=doc.createElement('div');
      // FILE_IO_ADAPTER: delivery dialog --surface is translucent; choose opaque theme tokens instead.
      box.style.cssText='background:var(--bg1,#fff);color:var(--ink,#222);border-radius:14px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 60px #0004;display:grid;gap:10px;font:14px/1.5 system-ui,sans-serif';
      const head=doc.createElement('div');head.textContent=say(file,'文件已准备好，请选择交付方式','File ready. Choose a delivery method.');
      head.style.cssText='font-size:17px;font-weight:700';
      const detail=doc.createElement('div');detail.textContent=file.name+' ('+file.blob.size+' bytes)';
      detail.style.cssText='overflow-wrap:anywhere;font-size:12px;opacity:.75';
      const info=doc.createElement('div');info.setAttribute('role','status');info.style.cssText='font-size:13px;min-height:20px;overflow-wrap:anywhere';
      box.append(head,detail);
      let active=false,closed=false,last=null;
      const buttons=[];
      function finish(){
        if(closed)return;
        if(active)return;
        closed=true;layer.remove();
        if(session.pathKey)held.delete(session.pathKey);
        resolve(last||receipt(file,'cancelled','dialog'));
      }
      function add(label,intent){
        const btn=doc.createElement('button');
        btn.type='button';btn.textContent=label;btn.style.cssText='padding:11px;border:1px solid #aaa;border-radius:8px;background:var(--bg0,#f4f6fb);color:inherit;cursor:pointer;font:inherit';
        btn.addEventListener('click',()=>{
          if(intent==='close'){finish();return;}
          if(active)return;active=true;for(const b of buttons)b.disabled=true;
          // Call deliver immediately under user activation, before any await.
          Promise.resolve(deliver(file,intent,{session})).then(r=>{
            last=r;info.textContent=message(r,file)+(r.deliveredName&&r.deliveredName!==file.name?' '+r.deliveredName:'');
            if(typeof options.onReceipt==='function')try{options.onReceipt(r);}catch(_){}
          }).catch(e=>{last=receipt(file,'failed',intent,{message:String(e?.message||e)});info.textContent=message(last,file);})
            .finally(()=>{active=false;for(const b of buttons)b.disabled=false;});
        });
        box.appendChild(btn);buttons.push(btn);return btn;
      }
      if(!cap.native)add(say(file,'下载原文件','Download original file'),'download');
      if(cap.share)add(say(file,cap.androidWeb&&['json','markdown'].includes(file.kind)?'分享TXT兼容副本':'分享文件','Share file'),'share');
      if(cap.local)add(say(file,'另存为（选择文件位置）','Save as (choose location)'),'save-local');
      add(say(file,'完成 / 取消','Done / Cancel'),'close');
      box.appendChild(info);layer.appendChild(box);doc.body.appendChild(layer);
      layer.addEventListener('click',e=>{if(e.target===layer)finish();});
    });
  }
  function openPreview(input) {
    let file;try{file=prepare(input);}catch(e){return {status:'failed',method:'preview',message:String(e.message||e)};}
    try{
      const url=host.URL.createObjectURL(file.blob);
      const w=host.open(url,'_blank');
      host.setTimeout(()=>{try{host.URL.revokeObjectURL(url);}catch(_){}},30000);
      return receipt(file,w?'preview-open-started':'failed','web-preview');
    }catch(e){return receipt(file,'failed','web-preview',{message:String(e.message||e)});}
  }
  function standaloneSource(){
    return '(function(){window.DCFileIO=('+createCoachFileIO.toString()+')(window);})();';
  }
  return Object.freeze({present,deliver,openPreview,standaloneSource,message,capability,
    readJsonText:text=>JSON.parse(String(text).replace(/^\uFEFF/,''))});
}

if(window.Capacitor?.isNativePlatform?.()&&typeof window.Capacitor.registerPlugin==="function") window.Capacitor.registerPlugin("LocalSave");
window.DCFileIO=createCoachFileIO(window);
</script>

<script>var __TBX_LOCALE=window.__TBX_LOCALE=localStorage.getItem('debate_coach_lang')==='zh'?'zh':'en';


// ── Data ──
var M=null;
var VIEW=0; // 0=start, 1=opening, 2=round, 3=summary
var roundIdx=0;
var STORAGE_KEY='flowing_v2_data';
var STORAGE_LIST_KEY='flowing_v2_matches';

var POSITIONS=['',(window.__TBX_LOCALE==='en'?'1st Speaker':'一辩'),(window.__TBX_LOCALE==='en'?'2nd Speaker':'二辩'),(window.__TBX_LOCALE==='en'?'3rd Speaker':'三辩'),(window.__TBX_LOCALE==='en'?'4th Speaker':'四辩'),(window.__TBX_LOCALE==='en'?'5th Speaker':'五辩'),(window.__TBX_LOCALE==='en'?'6th Speaker':'六辩'),(window.__TBX_LOCALE==='en'?'Coach':'教练'),(window.__TBX_LOCALE==='en'?'Judge':'评委'),(window.__TBX_LOCALE==='en'?'Other':'其他'),(window.__TBX_LOCALE==='en'?'N/A':'无')];
var ROUND_TYPES=[(window.__TBX_LOCALE==='en'?'Select':'选择'),(window.__TBX_LOCALE==='en'?'Cross-Examination':'质询'),(window.__TBX_LOCALE==='en'?'Direct Confrontation':'对辩'),(window.__TBX_LOCALE==='en'?'Deposition':'盘问'),(window.__TBX_LOCALE==='en'?'Rebuttal':'申论或驳论'),(window.__TBX_LOCALE==='en'?'Summary':'攻辩小结'),(window.__TBX_LOCALE==='en'?'Free Debate':'自由辩'),(window.__TBX_LOCALE==='en'?'Closing Speech':'总结陈词'),(window.__TBX_LOCALE==='en'?'Surprise Attack':'奇袭'),(window.__TBX_LOCALE==='en'?'Judge Q&A':'评委互动'),(window.__TBX_LOCALE==='en'?'Other':'其它')];

function roundLabel(r,i){
  if(r.name&&r.name!==(window.__TBX_LOCALE==='en'?'Select':'选择'))return r.name;
  return (window.__TBX_LOCALE==='en'?'Round ':'环节')+(i+1)+'/'+(M.rounds.length+1);
}

function save(){if(M){M._updated=Date.now();localStorage.setItem(STORAGE_KEY,JSON.stringify(M));}}

function newMatch(){
  return {
    title:'', date:new Date().toISOString(), _summaryVisited:false,
    rounds:[{
      name:(window.__TBX_LOCALE==='en'?'Constructive':'立论'),type:'opening',proPlayer:(window.__TBX_LOCALE==='en'?'1st Speaker':'一辩'),conPlayer:(window.__TBX_LOCALE==='en'?'1st Speaker':'一辩'),
      proStance:(window.__TBX_LOCALE==='en'?'Pro':'正方'),conStance:(window.__TBX_LOCALE==='en'?'Con':'反方'),
      pro:{definition:'',scope:'',standard:'',points:['',''],value:'',other:['']},
      con:{definition:'',scope:'',standard:'',points:['',''],value:'',other:['']}
    }],
    assessment:{proStruct:'',conStruct:'',proArg:'',conArg:'',impression:'',value:'',overall:'',otherAssess:''},
    lastView:1
  };
}

function loadMatch(){
  try{var s=localStorage.getItem(STORAGE_KEY);if(s){M=JSON.parse(s);migrateData();return true;}}catch(e){}
  return false;
}

function migrateData(candidate){
  var target=candidate||M;
  if(!target||!target.rounds)return;
  if(!target.rounds[0].proStance)target.rounds[0].proStance=(window.__TBX_LOCALE==='en'?'Pro':'正方');
  if(!target.rounds[0].conStance)target.rounds[0].conStance=(window.__TBX_LOCALE==='en'?'Con':'反方');
  target.rounds.forEach(function(r){
    if(r.type==='opening'){
      ['pro','con'].forEach(function(side){
        var o=r[side];
        if(typeof o.points==='string')o.points=o.points?[o.points,'']:['',''];
        if(!Array.isArray(o.points))o.points=['',''];
        if(o.points.length<2)o.points.push('');
        if(typeof o.other==='string')o.other=o.other?[o.other]:[''];
        if(!Array.isArray(o.other))o.other=[''];
      });
    }
    if(!r.mergedNote)r.mergedNote='';
  });
  if(!target.assessment)target.assessment={proStruct:'',conStruct:'',proArg:'',conArg:'',impression:'',value:'',overall:'',otherAssess:''};
  if(target.assessment.otherAssess===undefined)target.assessment.otherAssess='';
  delete target.assessment.aiNotes;
  if(target._summaryVisited===undefined)target._summaryVisited=false;
  if(target.lastView===undefined)target.lastView=1;
  if(target.lastRoundIdx===undefined)target.lastRoundIdx=0;
  return target;
}
// ── View switching ──
function goStart(){VIEW=0;render();}
function goOpening(){VIEW=1;render();}
function goRound(idx){VIEW=2;roundIdx=idx;render();}
function goSummary(){save();M._summaryVisited=true;M._lastRoundBeforeSummary=roundIdx;VIEW=3;render();}
function gotoLast(){if(M&&M.lastView!==undefined&&M.lastView>0){VIEW=M.lastView;if(VIEW===2)roundIdx=(M.lastRoundIdx!==undefined?M.lastRoundIdx:M.rounds.length-1);render();}else if(M){goOpening();}}

function render(localeOnly){
  if(!localeOnly){if(M){M.lastView=VIEW;M.lastRoundIdx=roundIdx;}save();}
  renderStepBar();
  var m=document.getElementById('main');
  var f=document.getElementById('footer-btns');
  updateTitleLabel();
  if(VIEW===0){renderStart(m,f);}
  else if(VIEW===1){renderOpening(m,f);}
  else if(VIEW===2){renderRound(m,f,roundIdx,localeOnly);}
  else if(VIEW===3){renderSummary(m,f);}
}

// ── Step bar ──
function renderStepBar(){
  var container=document.getElementById('step-bar-container');
  if(!M||VIEW===0){container.innerHTML='';return;}
  var total=M.rounds.length+1;
  var steps=[{name:(window.__TBX_LOCALE==='en'?'Constructive':'立论'),idx:1}];
  M.rounds.forEach(function(r,i){if(r.type!=='opening')steps.push({name:r.name,idx:steps.length+1});});
  steps.push({name:(window.__TBX_LOCALE==='en'?'Summary':'汇总分析'),idx:total});
  var h='<div class="step-bar">';
  steps.forEach(function(s,i){
    var cls='',labelCls='',isCurrent=false;
    if(VIEW===1)isCurrent=(i===0);
    else if(VIEW===2)isCurrent=(roundIdx===0?i===0:i===roundIdx);
    else if(VIEW===3)isCurrent=(i===steps.length-1);
    if(isCurrent){cls=' current';labelCls=' current';}
    else if(VIEW===3||(VIEW===2&&i<roundIdx)){cls=' done';labelCls=' done';}
    h+='<span class="dot'+cls+'"></span>';
    h+='<span class="label'+labelCls+'">'+s.idx+'/'+total+'. '+s.name+'</span>';
    if(i<steps.length-1)h+='<span class="sep">──</span>';
  });
  h+='</div>';
  container.innerHTML=h;
}

// ── View 0: Start ──
function renderStart(m,f){
  f.innerHTML='';
  var hasMatch=!!M;
  var h='<div class="start-wrap">';
  h+='<div class="logo">📋</div>';
  h+=(window.__TBX_LOCALE==='en'?'<h2>Debate · Flowing Tool</h2>':'<h2>辩论筑基 · 简易流水单</h2>');
  h+='<div class="desc"><ul>';
  h+=(window.__TBX_LOCALE==='en'?'<li>📝 <b>Constructive Case</b> — Map both sides: definition, criterion, arguments, value</li>':'<li>📝 <b>立论架构</b> — 梳理双方定义、标准、论点、价值</li>');
  h+=(window.__TBX_LOCALE==='en'?'<li>🎙️ <b>Round Notes</b> — Record clash content round by round</li>':'<li>🎙️ <b>环节记录</b> — 按环节记录双方攻防内容</li>');
  h+=(window.__TBX_LOCALE==='en'?'<li>📊 <b>Post-Match Summary</b> — Auto-compiled flow, multi-dimensional assessment</li>':'<li>📊 <b>赛后汇总</b> — 自动拼接流水，多维评估论证质量</li>');
  h+=(window.__TBX_LOCALE==='en'?'<li>📁 <b>Import / Export</b> — Format templates, JSON/MD/HTML/CSV/TXT</li>':'<li>📁 <b>导入/导出</b> — 支持赛制模板、JSON/MD/HTML/CSV/TXT</li>');
  h+='</ul></div>';
  h+='<div class="start-actions">';
  if(hasMatch)h+=(window.__TBX_LOCALE==='en'?'<button class="btn gold" onclick="gotoLast()">Continue Last Match</button>':'<button class="btn gold" onclick="gotoLast()">继续上次比赛</button>');
  h+='<button class="btn'+(hasMatch?'':' primary')+(window.__TBX_LOCALE==='en'?'" onclick="startNew()">New Match</button>':'" onclick="startNew()">开始新比赛</button>');
  h+=(window.__TBX_LOCALE==='en'?'<button class="btn-sm" onclick="document.getElementById(\'load-file\').click()">Load Match</button>':'<button class="btn-sm" onclick="document.getElementById(\'load-file\').click()">加载历史比赛</button>');
  h+=(window.__TBX_LOCALE==='en'?'<button class="btn-sm" onclick="document.getElementById(\'import-template\').click()">Import Template</button>':'<button class="btn-sm" onclick="document.getElementById(\'import-template\').click()">导入赛制模板</button>');
  h+='</div>';
  h+='<input type="file" id="load-file" accept=".json,.txt,.md,application/json,text/plain,text/markdown" class="hidden" onchange="loadFromFile(this)">';
  h+='<input type="file" id="import-template" accept=".json,.txt,.md,application/json,text/plain,text/markdown" class="hidden" onchange="importTemplate(this)">';
  if(hasMatch){
    h+=(window.__TBX_LOCALE==='en'?'<p class="text-sm text-gray mt-12">Match in progress: ':'<p class="text-sm text-gray mt-12">已有进行中的比赛：')+(M.title||(window.__TBX_LOCALE==='en'?'(Untitled)':'(未命名比赛)'))+'（'+new Date(M.date).toLocaleString()+'）</p>';
  }
  h+=renderMatchList();
  // Clear cache button
  h+=(window.__TBX_LOCALE==='en'?'<div style="margin-top:24px"><button class="btn-sm danger" onclick="clearAllData()">Clear All Data</button></div>':'<div style="margin-top:24px"><button class="btn-sm danger" onclick="clearAllData()">清除全部缓存</button></div>');
  h+='</div>';

}

function clearAllData(){
  if(!confirm((window.__TBX_LOCALE==='en'?'Clear all match data?\n\nThis will delete all locally stored flowing data including the current match and match history.\nThis cannot be undone.':'确定清除全部比赛缓存数据？\n\n此操作将删除本地存储的所有简易流水单数据，包括当前比赛和历史比赛列表。\n此操作不可撤销。')))return;
  if(!confirm((window.__TBX_LOCALE==='en'?'Confirm: Really delete all data?':'再次确认：真的要清除全部数据吗？')))return;
  // Clear all flowing-related keys
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    list.forEach(function(item){localStorage.removeItem('flowing_v2_'+item.key);});
    localStorage.removeItem(STORAGE_LIST_KEY);
  }catch(e){}
  localStorage.removeItem(STORAGE_KEY);
  M=null;VIEW=0;render();
  alert((window.__TBX_LOCALE==='en'?'Cache cleared.':'缓存已清除。'));
}

function renderMatchList(){
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    if(!list.length)return'';
    var h=(window.__TBX_LOCALE==='en'?'<div class="card" style="max-width:500px;text-align:left;margin-top:20px"><h3>Saved Matches</h3>':'<div class="card" style="max-width:500px;text-align:left;margin-top:20px"><h3>已保存比赛</h3>');
    list.forEach(function(item,i){
      h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)">';
      h+='<span style="flex:1;cursor:pointer" onclick="loadMatchByKey(\''+item.key+'\')">'+(item.title||(window.__TBX_LOCALE==='en'?'Untitled':'未命名'))+' <span class="text-sm text-gray">'+new Date(item.date).toLocaleString()+'</span></span>';
      h+='<button class="btn-sm danger" onclick="deleteMatch(\''+item.key+(window.__TBX_LOCALE==='en'?'\',this)">Delete</button>':'\',this)">删除</button>');
      h+='</div>';
    });
    h+='</div>';
    return h;
  }catch(e){return'';}
}

function startNew(){
  M=newMatch();VIEW=1;roundIdx=0;save();saveToList();render();
}

function loadFromFile(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(String(e.target.result).replace(/^\uFEFF/,""));
      if(data&&Array.isArray(data.rounds)&&data.rounds.length&&data.rounds.every(function(r){return r&&typeof r==="object"&&!Array.isArray(r);})){
        var candidate=migrateData(data);
        M=candidate;M._updated=Date.now();save();saveToList();gotoLast();
      }
      else{alert((window.__TBX_LOCALE==='en'?'Invalid match file format.':'无效的比赛文件格式'));}
    }catch(ex){alert((window.__TBX_LOCALE==='en'?'JSON parse error: ':'JSON解析失败：')+ex.message);}
  };
  reader.readAsText(input.files[0]);input.value='';
}

function loadMatchByKey(key){
  try{var s=localStorage.getItem('flowing_v2_'+key);if(s){M=JSON.parse(s);migrateData();save();gotoLast();}}catch(e){}
}

function deleteMatch(key,btn){
  if(!confirm((window.__TBX_LOCALE==='en'?'Delete this match?':'删除这场比赛？')))return;
  localStorage.removeItem('flowing_v2_'+key);
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    list=list.filter(function(x){return x.key!==key;});

function saveToList(){
  if(!M)return;
  try{
    var list=JSON.parse(localStorage.getItem(STORAGE_LIST_KEY)||'[]');
    var key='match_'+Date.now();
    localStorage.setItem('flowing_v2_'+key,JSON.stringify(M));

    var entry={key:key,title:M.title||(window.__TBX_LOCALE==='en'?'Untitled':'未命名'),date:M.date||new Date().toISOString()};

function onRoundTypeChange(idx,sel){
  var val=sel.value;
  if(val===(window.__TBX_LOCALE==='en'?'Select':'选择')){M.rounds[idx].name=(window.__TBX_LOCALE==='en'?'Select':'选择');save();render();return;}
  if(val===(window.__TBX_LOCALE==='en'?'Other':'其它')){
    var custom=prompt((window.__TBX_LOCALE==='en'?'Enter custom round name:':'请输入自定义环节名称：'),(window.__TBX_LOCALE==='en'?'Other':'其它'));
    if(custom&&custom.trim())val=custom.trim();else{M.rounds[idx].name=(window.__TBX_LOCALE==='en'?'Other':'其它');sel.value=(window.__TBX_LOCALE==='en'?'Other':'其它');save();return;}
  }
  M.rounds[idx].name=val;
  if(val===(window.__TBX_LOCALE==='en'?'Free Debate':'自由辩')){M.rounds[idx].proPlayer=(window.__TBX_LOCALE==='en'?'Other':'其他');M.rounds[idx].conPlayer=(window.__TBX_LOCALE==='en'?'Other':'其他');}
  else if(val===(window.__TBX_LOCALE==='en'?'Closing Speech':'总结陈词')){M.rounds[idx].proPlayer=(window.__TBX_LOCALE==='en'?'4th Speaker':'四辩');M.rounds[idx].conPlayer=(window.__TBX_LOCALE==='en'?'4th Speaker':'四辩');}
  save();render();
}

function goPrev(idx){
  save();
  if(idx<=1){goOpening();return;}
  VIEW=2;roundIdx=idx-1;render();
}

function goNext(idx,shouldConfirm){
  save();
  if(shouldConfirm){
    if(!confirm((window.__TBX_LOCALE==='en'?'This is the closing round or the last round before summary. Add another round?':'已是总结环节或汇总前最后一个环节，是否确认新增一个环节？')))return;
  }
  var nextIdx=idx+1;
  if(!M.rounds[nextIdx]){
    M.rounds.splice(nextIdx,0,{name:(window.__TBX_LOCALE==='en'?'Select':'选择'),type:null,proPlayer:'',conPlayer:'',proContent:'',conContent:'',mergedNote:''});save();
  }
  VIEW=2;roundIdx=nextIdx;render();
}

function deleteRound(idx){
  if(idx===0){alert((window.__TBX_LOCALE==='en'?'The constructive round cannot be deleted.':'立论环节不可删除'));return;}
  if(!confirm((window.__TBX_LOCALE==='en'?'Delete "':'确定删除「')+M.rounds[idx].name+(window.__TBX_LOCALE==='en'?'" round? This cannot be undone.':'」环节？此操作不可撤销。')))return;
  M.rounds.splice(idx,1);save();
  if(M.rounds.length<=1){goOpening();return;}
  if(roundIdx>=M.rounds.length)roundIdx=M.rounds.length-1;
  render();
}

function buildSideSummary(side){
  var lines=[];
  M.rounds.forEach(function(r,i){
    var label=(window.__TBX_LOCALE==='en'?'[':'【')+roundLabel(r,i)+(window.__TBX_LOCALE==='en'?']':'】');
    if(side==='pro'){
      if(r.type==='opening'){
        var o=r.pro;
        lines.push(label);
        if(o.definition)lines.push((window.__TBX_LOCALE==='en'?'Inherent Definition (Domain): ':'固有定义（域）：')+o.definition);
        if(o.scope)lines.push((window.__TBX_LOCALE==='en'?'Scope of Discussion: ':'论域切入：')+o.scope);
        if(o.standard)lines.push((window.__TBX_LOCALE==='en'?'Criterion: ':'标准：')+o.standard);
        var pts=Array.isArray(o.points)?o.points:[o.points];
        pts.forEach(function(p,i){if(p)lines.push((window.__TBX_LOCALE==='en'?'Sub-Argument':'分论点')+(pts.length>1?(i+1):'')+(window.__TBX_LOCALE==='en'?': ':'：')+p);});
        if(o.value)lines.push((window.__TBX_LOCALE==='en'?'Value Point: ':'价值点：')+o.value);
        var oths=Array.isArray(o.other)?o.other:[o.other];
        oths.forEach(function(ot,i){if(ot)lines.push((window.__TBX_LOCALE==='en'?'Additional':'其它补充')+(oths.length>1?(i+1):'')+(window.__TBX_LOCALE==='en'?': ':'：')+ot);});
      }else{
        if(r.proContent||r.proPlayer)lines.push(label+' '+(r.proPlayer||'')+'\n'+(r.proContent||''));
        else lines.push(label);
        if(r.mergedNote)lines.push((window.__TBX_LOCALE==='en'?'Merged/Notes: ':'合并/备注：')+r.mergedNote);
      }
    }else{
      if(r.type==='opening'){
        var o=r.con;
        lines.push(label);
        if(o.definition)lines.push((window.__TBX_LOCALE==='en'?'Inherent Definition (Domain): ':'固有定义（域）：')+o.definition);

async function doExport(content,mime,fname){
  save();
  var ext=fname.split('.').pop();
  var blob=new Blob(['﻿'+content],{type:mime+';charset=utf-8'});
  /* FILE_IO_ADAPTER: flow doExport preserves its report/BOM/template generation, calls DCFileIO.present
   * with CACHE/Debate-Coach. Importers: full JSON only in .json/.txt/.md;
   * preserve opening round, same-name round matching, migrateData, local-history limit. */
  var result=await top.DCFileIO.present({blob:blob,name:fname,mime:blob.type,kind:"ordinary",owner:"flow",lang:window.__TBX_LOCALE==='en'?'en':'zh',nativeLocation:{directory:"CACHE",folder:"Debate-Coach"}});
  if(["failed","unsupported"].includes(result.status))alert(top.DCFileIO.message(result,{lang:window.__TBX_LOCALE}));

}

function importTemplate(input){
  if(!input.files||!input.files[0])return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var tpl=JSON.parse(String(e.target.result).replace(/^\uFEFF/,""));
      if(!tpl||tpl.type!=='flowing_template'||!Array.isArray(tpl.rounds)||!tpl.rounds.every(function(r){return r&&typeof r==='object'&&!Array.isArray(r);})){alert((window.__TBX_LOCALE==='en'?'Invalid template file.':'无效的赛制模板文件'));return;}
      var baseMatch=M||newMatch();
      var opening=baseMatch.rounds[0];
      var newRounds=[opening];
      tpl.rounds.forEach(function(tr,i){
        if(tr.type==='opening'&&i===0)return;
        var existing=null;
        if(i<baseMatch.rounds.length&&baseMatch.rounds[i]&&baseMatch.rounds[i].name===tr.name)existing=baseMatch.rounds[i];
        newRounds.push(existing||{name:tr.name||(window.__TBX_LOCALE==='en'?'Select':'选择'),type:tr.type||null,proPlayer:'',conPlayer:'',proContent:'',conContent:'',mergedNote:''});
      });
      baseMatch.rounds=newRounds;M=baseMatch;save();
      alert((window.__TBX_LOCALE==='en'?'Template "':'模板「')+tpl.name+(window.__TBX_LOCALE==='en'?'" imported (':'」已导入（共')+newRounds.length+(window.__TBX_LOCALE==='en'?' rounds total).':'个环节）'));
      goOpening();
    }catch(ex){alert((window.__TBX_LOCALE==='en'?'JSON parse error: ':'JSON解析失败：')+ex.message);}
  };
  reader.readAsText(input.files[0]);input.value='';
}

 var key=target&&target.getAttribute('data-k'),selection=null,position=null;

 if(target&&typeof target.selectionStart==='number')try{selection={start:target.selectionStart,end:target.selectionEnd};}catch(_e){}
 if(target&&typeof target.scrollTop==='number')position={top:target.scrollTop,left:target.scrollLeft};
 draw();
 if(host&&scroll){host.scrollTop=scroll.top;host.scrollLeft=scroll.left;}
 if(idx>=0){
   var next=key?document.querySelector('[data-k="'+key.replace(/"/g,'')+'"]'):null;
   if(!next)next=document.querySelectorAll(selector)[idx];
   if(next&&!next.disabled){
     next.focus({preventScroll:true});

     if(position){next.scrollTop=position.top;next.scrollLeft=position.left;}

 }
